
services:

  etl_bot_app:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: app_financeiro

    restart: unless-stopped

    volumes:

      # Mapeamento dos datalakes e logs

      - ./volumes/notas_fiscais:/app/notas_fiscais

      - ./volumes/faturas:/app/faturas

      - ./volumes/logs:/app/logs

      # Mapeando o diretório app para desenvolvimento (hot-reload sem precisar de rebuild)

      - ./app:/app

    env_file:

      - .env

    networks:

      - app_network

      - postgres-data_default



networks:

  # Rede isolada para o pipeline de dados local

  app_network:

    driver: bridge

  postgres-data_default:

    external: true

