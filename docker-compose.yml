services:
  # ----------------------------------------------------
  # 1. SERVIÇO DE INGESTÃO (BOT DO TELEGRAM)
  # ----------------------------------------------------
  etl_bot_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_financeiro_bot
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONPATH=/app
    volumes:
      - ./app:/app
      - ./volumes:/volumes
      - ./.secrets:/secrets:ro
    env_file:
      - .env
    networks:
      - app_network
      - postgres-data_default

  # ----------------------------------------------------
  # 2. SERVIÇO DE PROCESSAMENTO (WORKER SILVER)
  # ----------------------------------------------------
  etl_worker_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_financeiro_worker
    restart: unless-stopped
    command: python /app/worker.py
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONPATH=/app
    volumes:
      - ./app:/app
      - ./volumes:/volumes
      - ./.secrets:/secrets:ro
    env_file:
      - .env
    networks:
      - app_network
      - postgres-data_default

networks:
  app_network:
    driver: bridge
  postgres-data_default:
    external: true
